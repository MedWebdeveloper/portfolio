    <g transform="translate(496 226)"><rect width="148" height="104" rx="14" fill="#f8faf8" stroke="#dfe8e3"/><text x="17" y="29" font-size="12" fill="#637477">Purchases</text><text x="17" y="62" font-size="25" font-weight="700" fill="#102a2f">26</text><text x="17" y="86" font-size="11" fill="#0e7c66">+4 verified</text></g>
    <g transform="translate(658 226)"><rect width="148" height="104" rx="14" fill="#f8faf8" stroke="#dfe8e3"/><text x="17" y="29" font-size="12" fill="#637477">Average CTR</text><text x="17" y="62" font-size="25" font-weight="700" fill="#102a2f">1.34%</text><text x="17" y="86" font-size="11" fill="#d9655b">Target 3%</text></g>
