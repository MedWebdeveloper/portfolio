  <text x="334" y="130" fill="#102a2f" font-family="Arial,sans-serif" font-size="28" font-weight="700">Campaign overview</text>
  <text x="334" y="185" fill="#102a2f" font-family="Arial,sans-serif" font-size="30" font-weight="700">Know what is working before spending more.</text>
