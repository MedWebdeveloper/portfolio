<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">JCIS Campaign Intelligence Dashboard</title>
  <desc id="desc">Dark green campaign dashboard with metric cards, chart and decision panel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d282d"/><stop offset="1" stop-color="#17474a"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-opacity=".22"/></filter>
  </defs>
  <rect width="1200" height="760" rx="34" fill="#f4f7f4"/>
  <rect x="58" y="48" width="1084" height="664" rx="26" fill="#fff" filter="url(#shadow)"/>
