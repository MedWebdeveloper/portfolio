  <rect x="334" y="356" width="510" height="290" rx="18" fill="#fff" stroke="#dfe8e3"/>
  <text x="360" y="393" fill="#0e7c66" font-family="Arial,sans-serif" font-size="11" font-weight="700">PERFORMANCE</text>
  <text x="360" y="421" fill="#102a2f" font-family="Arial,sans-serif" font-size="18" font-weight="700">Spend vs. attributed revenue</text>
  <g transform="translate(372 466)"><rect width="24" height="130" rx="5" fill="#102a2f"/><rect x="31" y="70" width="24" height="60" rx="5" fill="#d7f85d"/><rect x="78" y="30" width="24" height="100" rx="5" fill="#102a2f"/><rect x="109" y="50" width="24" height="80" rx="5" fill="#d7f85d"/><rect x="156" y="0" width="24" height="130" rx="5" fill="#102a2f"/><rect x="187" y="36" width="24" height="94" rx="5" fill="#d7f85d"/><rect x="234" y="48" width="24" height="82" rx="5" fill="#102a2f"/><rect x="265" y="16" width="24" height="114" rx="5" fill="#d7f85d"/><rect x="312" y="20" width="24" height="110" rx="5" fill="#102a2f"/><rect x="343" y="58" width="24" height="72" rx="5" fill="#d7f85d"/></g>
  <rect x="864" y="356" width="240" height="290" rx="18" fill="#102a2f"/>
  <text x="891" y="396" fill="#d7f85d" font-family="Arial,sans-serif" font-size="11" font-weight="700">DECISION CENTER</text>
  <text x="891" y="438" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700">OPTIMIZE</text>
  <text x="891" y="476" fill="#b8cac7" font-family="Arial,sans-serif" font-size="14">Keep the product.</text><text x="891" y="499" fill="#b8cac7" font-family="Arial,sans-serif" font-size="14">Repair measurement.</text>
  <rect x="891" y="548" width="172" height="48" rx="10" fill="#d7f85d"/><text x="921" y="578" fill="#102a2f" font-family="Arial,sans-serif" font-size="13" font-weight="700">Review decision →</text>
